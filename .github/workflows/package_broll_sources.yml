name: Package Broll Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package_broll_sources.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-broll-sources
          path: |
            work-v3/data_center_build.mp4
            work-v3/power_grid.mp4
            work-v3/bond_market.mp4
          retention-days: 7
          if-no-files-found: error
